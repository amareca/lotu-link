[workspace]
resolver = "2"
members = [
    "crates/lotu-domain",
    "crates/lotu-app",
    "crates/lotu-adapters",
    "src-tauri",
]
# `src-tauri` is excluded from the default set because compiling it requires the
# frontend bundle (`frontendDist = "../dist"`). The Tauri crate is verified with
# `cargo check -p lotu-link` once the frontend has been built.
default-members = [
    "crates/lotu-domain",
    "crates/lotu-app",
    "crates/lotu-adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
lotu-domain = { path = "crates/lotu-domain" }
lotu-app = { path = "crates/lotu-app" }
lotu-adapters = { path = "crates/lotu-adapters" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
